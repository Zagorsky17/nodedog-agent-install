# Агент NodeDog на ноде Remnawave.
#
# Файл живёт в /opt/nodedog-agent/ — В ОТДЕЛЬНОМ КАТАЛОГЕ, а не в
# compose-файле ноды. Это не вкусовщина, а первое из условий, которыми
# держится обещание проекта: агент не должен быть способен помешать
# работе ноды.
#
# Добавь мы сервис в файл ноды — каждое `docker compose up -d` при
# обновлении агента пересоздавало бы изменившиеся сервисы и рвало бы
# клиентские соединения ради сборщика статистики. Отдельный проект
# означает, что команды здесь не видят контейнер ноды вовсе.
#
#     docker compose up -d          # поставить и запустить
#     docker compose pull && docker compose up -d    # обновить
#     docker compose logs -f        # смотреть журнал агента

name: nodedog-agent

services:
  agent:
    # Тег пинуется явно, без latest: `docker compose pull` не должен
    # однажды притащить на боевую ноду то, чего никто не проверял.
    image: ghcr.io/zagorsky17/nodedog-agent:${AGENT_IMAGE_TAG:?задайте AGENT_IMAGE_TAG в .env}
    container_name: nodedog-agent
    restart: unless-stopped
    env_file:
      - .env

    environment:
      # Путь к журналу и раздел для метрики диска собираются из того же
      # AGENT_LOG_DIR, который монтируется ниже. Задавать их в .env
      # отдельными значениями нельзя: два независимых пути однажды
      # разойдутся, и агент уйдёт ждать файл, которого в контейнере нет.
      NODEDOG_LOG_PATH: ${AGENT_LOG_DIR:-/var/log/remnanode}/${AGENT_LOG_FILE:-access.log}
      # В контейнере корень — overlay образа, а не диск ноды, поэтому
      # раздел, о котором панель говорит «диск сервера», приходит внутрь
      # отдельным монтированием (см. volumes). Путь фиксирован: что
      # именно он показывает, решает AGENT_DISK_DIR на хосте.
      NODEDOG_DISK_PATH: /host/disk

    # --- Видимость хоста ---------------------------------------------------
    # Две метрики описывают ноду, а не контейнер: живость процесса Xray
    # и число установленных соединений. И список процессов, и таблица
    # соединений свои у каждого пространства имён, поэтому без этих двух
    # строк агент снимет их про себя и отдаст панели правдоподобную
    # неправду — «Xray остановлен, соединений нет». Агент такое замечает
    # и предупреждает в журнале, но чинить это должен compose.
    #
    # Видимость при этом не даёт власти: ниже сброшены все capabilities
    # и задан непривилегированный пользователь, поэтому послать сигнал
    # чужому процессу агент не может.
    pid: host
    network_mode: host

    # --- Ограничение прав --------------------------------------------------
    # Ровно то же, что делает systemd-юнит: ни одной capability, не root,
    # права не наращиваются, файловая система только для чтения.
    #
    # Здесь НЕТ и не должно появиться privileged: true — он отключает
    # seccomp, AppArmor и возвращает все capability разом, то есть даёт
    # агенту ровно ту власть над нодой, которой у него быть не должно.
    #
    # Здесь НЕТ и не должно появиться /var/run/docker.sock — с ним агент
    # смог бы остановить или пересоздать контейнер ноды.
    #
    # UID зафиксирован: каталог состояния внутри образа принадлежит
    # именно ему, и смена UID оставила бы агента без права писать в
    # собственный том. GID меняется — это группа, которой принадлежит
    # журнал Xray на конкретной ноде, его подбирает установщик.
    user: "65532:${AGENT_GID:?задайте AGENT_GID — GID группы журнала, см. .env.example}"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m

    # --- Ресурсы -----------------------------------------------------------
    # Потолки те же, что в systemd-юните: агент в норме занимает 20-40 МБ
    # и доли процента ядра, а превысив их, обязан умереть сам, а не
    # вытеснить Xray.
    mem_limit: 128m
    cpus: 0.2
    pids_limit: 128
    # При нехватке памяти ядро выбирает жертву по этому счёту. Агенту
    # он поднят намеренно: под нагрузкой первым обязан умирать сборщик
    # статистики, а не то, ради чего нода существует.
    oom_score_adj: 500

    # --- Журналы самого агента ---------------------------------------------
    # Без потолка json-file растёт без предела и однажды заполняет тот
    # самый раздел, переполнение которого останавливает Xray.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    volumes:
      # Журнал Xray — строго на чтение. Ротацией занимается logrotate,
      # файл читают и другие (встроенный Torrent Blocker Remnawave).
      - ${AGENT_LOG_DIR:-/var/log/remnanode}:${AGENT_LOG_DIR:-/var/log/remnanode}:ro
      # Раздел для метрики «диск сервера». По умолчанию корневой — тот
      # же, что видит systemd-вариант агента, и тот, на который смотрит
      # тревога панели disk_percent >= 90.
      #
      # Раньше здесь стоял каталог журнала, и «диск сервера» с
      # «местом под журнал» мерили одну файловую систему. На ноде с
      # отдельным /var/log корневой раздел не отслеживался вовсе: он
      # заполнялся, нода вставала, а в панели всё было в порядке.
      #
      # Монтирование строго на чтение, и агент делает по этому пути
      # ровно один системный вызов — statfs. Так же снимает метрики
      # хоста node_exporter, и по той же причине: занятость раздела
      # снаружи контейнера иначе не видна. Кого смущает корень целиком,
      # ставит в AGENT_DISK_DIR любой другой каталог хоста.
      - ${AGENT_DISK_DIR:-/}:/host/disk:ro
      # Позиция чтения журнала и очередь неотправленных батчей. Именно
      # поэтому перезапуск агента не теряет и не дублирует строки.
      - state:/var/lib/nodedog

    healthcheck:
      # В образе нет ни оболочки, ни утилит — проверяемся собственным
      # ключом --version. Он ничего не читает и не отправляет.
      test: ["CMD", "/nodedog-agent", "--version"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  state:
